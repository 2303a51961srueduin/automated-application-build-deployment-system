name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run backend tests
        run: npm test
        env:
          JWT_SECRET: ci-test-secret-that-is-at-least-32-characters
          DATABASE_PATH: ":memory:"

      - name: Build frontend
        run: npm run build

      - name: Build sample application
        run: npm run build --prefix apps/sample-web

      - name: Build Docker image
        run: docker build --tag devops-build-system:ci .
