name: Deploy to Docker host

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Build deployment image
        run: docker build --tag "devops-build-system:git-${GITHUB_SHA}" .

      - name: Transfer image to the Docker host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          docker save "devops-build-system:git-${GITHUB_SHA}" | \
            ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "docker load"

      - name: Start container and verify health
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" \
            "IMAGE_TAG='git-${GITHUB_SHA}' bash -s" <<'REMOTE'
          set -eu
          docker rm --force devops-build-system >/dev/null 2>&1 || true
          docker run --detach --name devops-build-system --restart unless-stopped \
            --publish 4000:4000 \
            --env-file /etc/devops-build-system.env \
            --mount source=devops-system-data,target=/app/data \
            --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            "devops-build-system:${IMAGE_TAG}"
          attempt=0
          until [ "$attempt" -ge 24 ]; do
            status="$(docker inspect --format '{{.State.Health.Status}}' devops-build-system 2>/dev/null || true)"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
            attempt=$((attempt + 1))
          done
          docker logs devops-build-system
          echo "Deployment health check did not pass." >&2
          exit 1
          REMOTE
