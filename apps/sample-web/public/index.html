<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevOps Demo Application</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101927; color: #eef4fa; font: 16px system-ui, sans-serif; }
      main { max-width: 640px; padding: 48px; }
      p { color: #a7b5c7; line-height: 1.7; }
      .badge { color: #72dfb0; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }

  <body>
    <main>
      <div class="badge">Container deployment is live</div>
      <h1>Built and deployed with the DevOps Build System</h1>
